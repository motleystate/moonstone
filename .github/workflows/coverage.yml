name: Code Coverage

on:
  [push, pull_request]

jobs:
  run:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-cov "coverage>=7.10"
        # Editable install, so the command-line tests' subprocesses run the code under ./moonstone that is measured.
        pip install -e .
        pip install odfpy     # optional dependencies
        pip install openpyxl  # idem
        pip install xlrd      # idem
    - name: Generate coverage report
      run: |
        pytest --cov ./moonstone --cov-report xml --cov-report term
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
