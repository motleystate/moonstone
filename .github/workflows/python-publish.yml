# Build and upload the package to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no password or token is stored in the repository. On PyPI, the project
# needs a trusted publisher for owner "motleystate", repository "moonstone" and workflow "python-publish.yml".
# Earlier versions stay available on PyPI; a version number can never be uploaded twice.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Check the release tag matches the package version
      run: |
        version=$(python -c "exec(open('moonstone/version.py').read()); print(__version__)")
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "Release tag ${GITHUB_REF_NAME} does not match package version v${version}"
          exit 1
        fi
    - name: Build
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
